services:
  - type: web
    name: bible-trivia-game
    env: node
    plan: free
    region: oregon
    buildCommand: npm run postinstall && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
